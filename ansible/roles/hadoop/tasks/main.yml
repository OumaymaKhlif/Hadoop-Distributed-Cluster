
---
- name: Vérifier si Hadoop est déjà installé
  ansible.builtin.stat:
    path: /home/oumayma/hadoop
  register: hadoop_installation

- name: Télécharger Hadoop 3.3.6
  ansible.builtin.get_url:
    url: https://archive.apache.org/dist/hadoop/common/hadoop-3.3.6/hadoop-3.3.6.tar.gz
    dest: /tmp/hadoop-3.3.6.tar.gz
    mode: "0644"
    timeout: 120
  register: hadoop_download
  retries: 3
  delay: 5
  until: hadoop_download is succeeded
  when: not hadoop_installation.stat.exists

- name: Extraire Hadoop
  ansible.builtin.unarchive:
    src: /tmp/hadoop-3.3.6.tar.gz
    dest: /home/oumayma/
    remote_src: true
  when: not hadoop_installation.stat.exists

- name: Renommer le dossier Hadoop
  ansible.builtin.command:
    cmd: mv /home/oumayma/hadoop-3.3.6 /home/oumayma/hadoop
    creates: /home/oumayma/hadoop

# Attribuer les fichiers Hadoop à oumayma sur toutes les machines
- name: Attribuer les fichiers Hadoop à oumayma
  ansible.builtin.file:
    path: /home/oumayma/hadoop
    owner: oumayma
    group: oumayma
    recurse: true
    state: directory

# 8. Configurer les variables d'environnement dans .bashrc
- name: Configurer les variables Java et Hadoop dans .bashrc
  ansible.builtin.blockinfile:
    path: /home/oumayma/.bashrc
    create: true
    owner: oumayma
    group: oumayma
    marker: "# {mark} ANSIBLE HADOOP ENVIRONMENT"
    block: |
      # ===== JAVA =====
      export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
      export PATH=$JAVA_HOME/bin:$PATH

      # ===== HADOOP =====
      export HADOOP_HOME=$HOME/hadoop
      export HADOOP_CONF_DIR=$HADOOP_HOME/etc/hadoop
      export HADOOP_MAPRED_HOME=$HADOOP_HOME
      export HADOOP_COMMON_HOME=$HADOOP_HOME
      export HADOOP_HDFS_HOME=$HADOOP_HOME
      export HADOOP_YARN_HOME=$HADOOP_HOME
      export PATH=$PATH:$HADOOP_HOME/bin

# 9. Déployer les fichiers de configuration Hadoop
- name: Déployer core-site.xml
  ansible.builtin.template:
    src: core-site.xml
    dest: /home/oumayma/hadoop/etc/hadoop/core-site.xml
    owner: oumayma
    group: oumayma
    mode: "0644"

- name: Déployer hdfs-site.xml
  ansible.builtin.template:
    src: hdfs-site.xml
    dest: /home/oumayma/hadoop/etc/hadoop/hdfs-site.xml
    owner: oumayma
    group: oumayma
    mode: "0644"

- name: Déployer mapred-site.xml
  ansible.builtin.template:
    src: mapred-site.xml
    dest: /home/oumayma/hadoop/etc/hadoop/mapred-site.xml
    owner: oumayma
    group: oumayma
    mode: "0644"

- name: Déployer yarn-site.xml
  ansible.builtin.template:
    src: yarn-site.xml
    dest: /home/oumayma/hadoop/etc/hadoop/yarn-site.xml
    owner: oumayma
    group: oumayma
    mode: "0644"

- name: Configurer hadoop-env.sh
  ansible.builtin.template:
    src: hadoop-env.sh
    dest: /home/oumayma/hadoop/etc/hadoop/hadoop-env.sh
    owner: oumayma
    group: oumayma
    mode: "0644"

# 10. Définir les machines du cluster
- name: Configurer les workers Hadoop
  ansible.builtin.copy:
    dest: /home/oumayma/hadoop/etc/hadoop/workers
    content: |
      datanode1
      datanode2
    owner: oumayma
    group: oumayma
    mode: "0644"
  when: inventory_hostname == 'namenode'

- name: Configurer le fichier masters
  ansible.builtin.copy:
    dest: /home/oumayma/hadoop/etc/hadoop/masters
    content: |
      namenode
    owner: oumayma
    group: oumayma
    mode: "0644"
  when: inventory_hostname == 'namenode'

# 11. Définir le hostname de chaque machine
- name: Définir le hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# 12. Configurer la résolution des noms du cluster
- name: Configurer les hôtes du cluster Hadoop
  ansible.builtin.blockinfile:
    path: /etc/hosts
    block: |
      192.168.56.120 namenode NameNode
      192.168.56.121 datanode1
      192.168.56.122 datanode2


